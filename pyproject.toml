[project]
name = "python01"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Simon Lau", email = "simon.lau.sg@gmail.com" }
]
requires-python = ">=3.10"
dependencies = []

[project.scripts]
python01 = "python01:main"

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[tool.pyrefly]
preset = "all"

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
